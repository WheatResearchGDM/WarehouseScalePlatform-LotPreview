name: Deploy lot preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/pages _site/public/vendor
          cp index.html .nojekyll _site/
          cp pages/app.js pages/styles.css _site/pages/
          cp public/favicon.svg public/gdm-logo.svg _site/public/
          cp public/plot-import.js public/weighing-store.js public/weighing-utils.js _site/public/
          cp public/vendor/xlsx.full.min.js public/vendor/xlsx.LICENSE.txt _site/public/vendor/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
